openapi: 3.0.0
info:
  title: AI Portfolio Backend API
  version: 1.0.0
  description: |
    API documentation for the AI Portfolio backend application.
    This API provides endpoints for portfolio management, market data, and AI-powered recommendations.

servers:
  - url: http://localhost:3000
    description: Local development server
  - url: https://api.ai-portfolio.com
    description: Production server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for authentication

  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Indicates if the request was successful
        data:
          type: object
          description: Response data

    ApiErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [false]
          description: Always false for error responses
        message:
          type: string
          description: Human-readable error message
        code:
          type: string
          description: Error code for programmatic handling
        error:
          type: string
          description: Detailed error information

    AuthCredentials:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: User's email address
        password:
          type: string
          format: password
          description: User's password
        firstName:
          type: string
          description: User's first name
        lastName:
          type: string
          description: User's last name

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token
        user:
          type: object
          properties:
            id:
              type: string
              description: User's unique identifier
            email:
              type: string
              description: User's email address

    UserProfile:
      type: object
      properties:
        firstName:
          type: string
          description: User's first name
        lastName:
          type: string
          description: User's last name
        occupation:
          type: string
          description: User's occupation
        age:
          type: integer
          minimum: 18
          maximum: 120
          description: User's age
        income:
          type: integer
          minimum: 0
          description: User's annual income
        riskProfile:
          type: string
          enum: [CONSERVATIVE, MODERATE, AGGRESSIVE]
          description: User's risk tolerance
        preferredInvestmentTypes:
          type: array
          items:
            type: string
            enum: [EQUITY, CRYPTOCURRENCY, COMMODITIES, GOLD]
          description: User's preferred investment types
        preferredRegions:
          type: array
          items:
            type: string
            enum: [US, EU, ASIA, GLOBAL]
          description: User's preferred investment regions
        country:
          type: string
          description: User's country of residence

    Portfolio:
      type: object
      required:
        - name
        - investmentTypes
        - regions
      properties:
        id:
          type: string
          description: Portfolio's unique identifier
        userId:
          type: string
          description: User's unique identifier
        name:
          type: string
          description: Portfolio name
        description:
          type: string
          description: Portfolio description
        investmentTypes:
          type: array
          items:
            type: string
            enum: [EQUITY, CRYPTOCURRENCY, COMMODITIES, GOLD]
          description: Types of investments in the portfolio
        regions:
          type: array
          items:
            type: string
            enum: [US, EU, ASIA, GLOBAL, INDIA]
          description: Investment regions
        createdAt:
          type: string
          format: date-time
          description: Portfolio creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
        assets:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Asset's unique identifier
              portfolioId:
                type: string
                description: Portfolio identifier
              assetSymbol:
                type: string
                description: Asset symbol
              investmentType:
                type: string
                enum: [EQUITY, CRYPTOCURRENCY, COMMODITIES, GOLD]
                description: Type of investment
              region:
                type: string
                enum: [US, EU, ASIA, GLOBAL, INDIA]
                description: Investment region
              quantity:
                type: number
                description: Number of shares/units
              purchasePrice:
                type: number
                description: Purchase price per unit
              amountInvested:
                type: number
                description: Total amount invested
              lastUpdated:
                type: string
                format: date-time
                description: Last price update timestamp
              createdAt:
                type: string
                format: date-time
                description: Asset creation timestamp
              updatedAt:
                type: string
                format: date-time
                description: Last update timestamp
              currentPrice:
                type: number
                description: Current market price
              currentValue:
                type: number
                description: Current total value
              priceChange24h:
                type: number
                description: 24-hour price change
              percentageChange24h:
                type: number
                description: 24-hour percentage change
        totalValue:
          type: number
          description: Total portfolio value
        totalInvested:
          type: number
          description: Total amount invested
        totalProfitLoss:
          type: number
          description: Total profit/loss
        percentageReturn:
          type: number
          description: Total return percentage

    PortfolioTransaction:
      type: object
      required:
        - portfolioId
        - symbol
        - quantity
        - price
        - type
      properties:
        portfolioId:
          type: string
          description: Portfolio identifier
        symbol:
          type: string
          description: Asset symbol
        quantity:
          type: number
          description: Number of shares/units
        price:
          type: number
          description: Transaction price
        type:
          type: string
          enum: [BUY, SELL]
          description: Transaction type
        investmentType:
          type: string
          enum: [EQUITY, CRYPTOCURRENCY, COMMODITIES, GOLD]
          description: Type of investment
        region:
          type: string
          enum: [US, EU, ASIA, GLOBAL, INDIA]
          description: Investment region

    TransactionHistory:
      type: object
      properties:
        id:
          type: string
          description: Transaction's unique identifier
        portfolioId:
          type: string
          description: Portfolio identifier
        symbol:
          type: string
          description: Asset symbol
        quantity:
          type: number
          description: Number of shares/units
        price:
          type: number
          description: Transaction price
        type:
          type: string
          enum: [BUY, SELL]
          description: Transaction type
        investmentType:
          type: string
          enum: [EQUITY, CRYPTOCURRENCY, COMMODITIES, GOLD]
          description: Type of investment
        region:
          type: string
          enum: [US, EU, ASIA, GLOBAL, INDIA]
          description: Investment region
        timestamp:
          type: string
          format: date-time
          description: Transaction timestamp

    MarketQuote:
      type: object
      properties:
        symbol:
          type: string
          description: Asset symbol
        open:
          type: string
          description: Opening price
        high:
          type: string
          description: Highest price
        low:
          type: string
          description: Lowest price
        price:
          type: string
          description: Current price
        volume:
          type: string
          description: Trading volume
        latestTradingDay:
          type: string
          description: Latest trading day
        previousClose:
          type: string
          description: Previous closing price
        change:
          type: string
          description: Price change
        changePercent:
          type: string
          description: Price change percentage

    TimeSeriesRequest:
      type: object
      properties:
        interval:
          type: string
          enum: [1min, 5min, 15min, 30min, 60min, daily, weekly, monthly]
          description: Time interval for data points
        outputsize:
          type: string
          enum: [compact, full]
          description: Number of data points to return

    TimeSeriesResponse:
      type: array
      items:
        type: object
        properties:
          timestamp:
            type: string
            format: date-time
          open:
            type: number
          high:
            type: number
          low:
            type: number
          close:
            type: number
          volume:
            type: number

    SearchResponse:
      type: object
      properties:
        bestMatches:
          type: array
          items:
            type: object
            properties:
              symbol:
                type: string
              name:
                type: string
              type:
                type: string
              region:
                type: string

    AIChatMessage:
      type: object
      required:
        - query
        - model
        - action
      properties:
        query:
          type: string
          description: User's query message
        model:
          type: string
          enum: [GPT_4, GPT_4O, GPT_4O_MINI, GEMINI_2_FLASH, GEMINI_1_5_FLASH, GEMINI_1_5_PRO]
          description: AI model to use
        action:
          type: string
          enum: [ANALYSIS, MARKET_INSIGHT, RECOMMENDATION, REBALANCE, PERFORMANCE, EDUCATION, COMPARISON, FORECAST, GENERAL]
          description: Type of AI action

    AIResponse:
      type: object
      properties:
        response:
          type: string
          description: AI's response message
        actions:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              data:
                type: object
        model:
          type: string
          description: AI model used

    ChatDetails:
      type: object
      properties:
        chatId:
          type: string
        messages:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                enum: [user, assistant]
              content:
                type: string
              timestamp:
                type: string
                format: date-time

    Feedback:
      type: object
      required:
        - isHelpful
      properties:
        isHelpful:
          type: boolean
          description: Whether the response was helpful

paths:
  /auth/register:
    post:
      summary: Register a new user
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCredentials'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /auth/login:
    post:
      summary: Login user
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCredentials'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /user/profile:
    get:
      summary: Get user profile
      tags: [User]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    $ref: '#/components/schemas/UserProfile'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

    post:
      summary: Update user profile
      tags: [User]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfile'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    $ref: '#/components/schemas/UserProfile'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /portfolio:
    get:
      summary: Get all portfolios
      tags: [Portfolio]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Portfolios retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Portfolio'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

    post:
      summary: Create new portfolio
      tags: [Portfolio]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Portfolio'
      responses:
        '201':
          description: Portfolio created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    $ref: '#/components/schemas/Portfolio'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /portfolio/{id}:
    get:
      summary: Get portfolio details
      tags: [Portfolio]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Portfolio details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    $ref: '#/components/schemas/Portfolio'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Portfolio not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

    delete:
      summary: Delete portfolio
      tags: [Portfolio]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Portfolio deleted successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Portfolio not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /portfolio/buy:
    post:
      summary: Buy assets for portfolio
      tags: [Portfolio]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortfolioTransaction'
      responses:
        '200':
          description: Assets purchased successfully
          content:
