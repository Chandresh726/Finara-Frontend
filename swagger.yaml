  /market/equity/search:
    get:
      summary: Search equities
      tags: [Market]
      security:
        - bearerAuth: []
      parameters:
        - name: keywords
          in: query
          required: true
          schema:
            type: string
        - name: region
          in: query
          schema:
            type: string
            enum: [US, EU, ASIA, GLOBAL]
      responses:
        '200':
          description: Search results retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    $ref: '#/components/schemas/SearchResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /market/crypto/quote:
